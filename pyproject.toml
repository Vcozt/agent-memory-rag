[project]
name = "agent-memory-rag"
version = "0.1.0"
description = "RAG-powered semantic search for AI agent workspace memory files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Vcozt"}]
keywords = ["rag", "ai-agent", "memory", "semantic-search", "lancedb"]

dependencies = [
    "lancedb>=0.30.0",
    "fastembed>=0.6.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
api = ["httpx>=0.27.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
amr = "agent_memory_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_memory_rag"]
